[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sphota"
dynamic = ["version"]
description = "GPS for meaning: an open, frozen, human-readable coordinate system for meaning across languages and embedding models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Sphota Authors" }]
keywords = ["embeddings", "semantic-id", "multilingual", "quantization", "nlp", "search", "vector-database"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
# The light core (parse / compare / distance / labels) needs only numpy.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Default encoder: ONNX Runtime + HF tokenizers (no torch).
encode = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23"]
# Use any sentence-transformers model (torch) for encoding and adapter training.
torch = ["sentence-transformers>=3.0", "torch>=2.1"]
cli = ["typer>=0.12", "rich>=13"]
integrations = ["langchain-core>=0.2", "llama-index-core>=0.10"]
# Offline build pipeline (reproduce the v1 release).
build = ["sentence-transformers>=3.0", "torch>=2.1", "scikit-learn>=1.4", "pandas>=2.0",
         "pyarrow>=14", "datasets>=2.19", "huggingface_hub>=0.23", "scipy>=1.11"]
all = ["sphota[encode,cli]"]
dev = ["sphota[encode,cli,build]", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10",
       "pre-commit>=3.7"]

[project.scripts]
sphota = "sphota.cli:main"

[project.urls]
Homepage = "https://github.com/thiruvikramanpravartak/sphota"
Documentation = "https://github.com/thiruvikramanpravartak/sphota/tree/main/docs"
Issues = "https://github.com/thiruvikramanpravartak/sphota/issues"

[tool.hatch.version]
path = "src/sphota/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sphota"]

[tool.hatch.build.targets.sdist]
include = ["src/sphota", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["atlas", "data", ".cache", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "E731", "B905", "SIM108", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"src/sphota/build/*" = ["B", "SIM", "RUF059", "RUF007"]
"examples/*" = ["SIM115"]

[tool.mypy]
python_version = "3.10"
files = ["src/sphota/codes.py", "src/sphota/release.py", "src/sphota/space.py", "src/sphota/distance.py"]
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: needs model downloads / network",
]

[tool.coverage.run]
source = ["sphota"]
omit = ["src/sphota/build/*", "src/sphota/integrations/*"]
