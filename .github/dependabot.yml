# Dependency updates. The 14-day cooldown keeps freshly published (possibly hijacked) versions out
# until the ecosystem has had time to notice; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /atlas
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { atlas: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { ci-tools: { patterns: ["*"] } }
