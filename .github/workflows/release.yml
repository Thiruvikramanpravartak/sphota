# Publish the Python package to PyPI when a version tag is pushed (git tag v1.0.0 && git push --tags).
# Trusted publishing: no token is stored anywhere. One-time setup on pypi.org → Account →
# Publishing → "Add a pending publisher": project sphota, owner Thiruvikramanpravartak,
# repository sphota, workflow release.yml, environment pypi. Then in GitHub Settings →
# Environments → pypi: add yourself as a required reviewer, so every release waits for your click.
#
# Defences (LiteLLM 2026 lessons): tests and build run in separate jobs; the build job installs
# only hash-pinned build tools; the wheel must equal the git-tracked source (no .pth hooks); the
# publish job runs no project code and is the only job with an OIDC token; PyPI attestations
# (PEP 740) let users verify the wheel came from this workflow.
name: Release to PyPI
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[cli]" pytest
      - name: Tag matches the package version
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          v=$(python -c "import sphota; print(sphota.__version__)")
          test "v$v" = "$TAG" || { echo "tag $TAG != package v$v"; exit 1; }
      - run: pytest -m "not slow" -q

  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes --no-deps -r .github/requirements/release.txt
      - run: python -m build --no-isolation --outdir dist .
      - run: python scripts/check_wheel.py dist/*.whl
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/, if-no-files-found: error }

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with: { attestations: true }
