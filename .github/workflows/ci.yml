name: CI

on:
  push:
    branches: [main, "build/**", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy numpy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test-core:
    # numpy-only core + CLI, no model downloads
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[cli]" pytest pytest-cov
      - run: pytest -m "not slow" --cov=sphota --cov-report=term-missing

  test-encode:
    # ONNX encoder end-to-end (downloads the small anchor model once, cached)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/sphota/data/v1/manifest.json') }}
      - run: pip install -e ".[encode,cli]" pytest
      - run: pytest -m slow -k "not torch"
      - name: Run examples
        run: |
          for f in examples/[0-9]*.py; do echo "== $f"; python "$f" || exit 1; done

  atlas:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: atlas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
