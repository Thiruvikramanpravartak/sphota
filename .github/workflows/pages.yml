# Publish the Meaning Atlas (site root) and the docs (/docs/) to GitHub Pages.
# Manual only: Actions → "Publish site" → Run workflow. One-time setup: Settings → Pages →
# Source: "GitHub Actions". Serves at https://thiruvikramanpravartak.github.io/sphota/
name: Publish site
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && ATLAS_BASE=/sphota/ npm run build
        working-directory: atlas
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material && NO_MKDOCS_2_WARNING=1 mkdocs build --strict -d atlas/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with: { path: atlas/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
